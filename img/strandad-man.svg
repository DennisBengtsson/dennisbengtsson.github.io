<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 662" role="img" aria-labelledby="titel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titel">En blond, långhårig och skäggig mager man sitter på en klippa ute på havet</title>
  <defs>
    <style>
      .tusch { fill: none; stroke: #2a2a2a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .tunn  { fill: none; stroke: #2a2a2a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .hud   { fill: #f1d8bf; stroke: #2a2a2a; stroke-width: 3; stroke-linejoin: round; }
      .hud2  { fill: #e4c6a8; stroke: #2a2a2a; stroke-width: 3; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="800" height="662" fill="#ffffff"/>

  <!-- sol och fåglar -->
  <circle cx="140" cy="118" r="38" class="tusch"/>
  <g class="tunn">
    <path d="M140 60v-16M140 192v-16M82 118h-16M214 118h-16M99 77l-11-11M192 170l-11-11M181 77l11-11M88 170l11-11"/>
  </g>
  <g class="tusch">
    <path d="M560 150q12-12 24 0q12-12 24 0"/>
    <path d="M622 186q9-9 18 0q9-9 18 0"/>
    <path d="M520 210q7-7 14 0q7-7 14 0"/>
  </g>

  <!-- horisont -->
  <path d="M0 448h800" class="tunn" opacity=".45"/>

  <!-- klippan -->
  <path d="M214 506 C222 468 246 440 282 428 C300 404 336 396 364 402 C392 388 430 390 452 402
           C488 396 526 410 548 432 C574 448 590 476 598 506 Z"
        fill="#e7e5e1" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
  <g class="tunn" opacity=".7">
    <path d="M262 470l26-20M286 488l34-28M330 470l22-18M478 446l30 22M506 470l30 22M452 482l22 18"/>
    <path d="M378 430c18 8 40 8 58 0M300 452c10-6 22-8 34-6"/>
  </g>

  <!-- mannen, uppskalad runt klippans topp -->
  <g transform="translate(420 400) scale(1.32) translate(-420 -400)">
    <!-- bortre benet och armen (lite mörkare) -->
    <path d="M404 388 L448 328 L466 396" fill="none" stroke="#2a2a2a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M404 388 L448 328 L466 396" fill="none" stroke="#e4c6a8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M466 398 q14 -2 22 4 q-12 6 -26 2 z" class="hud2"/>
    <path d="M398 306 L428 338 L452 332" fill="none" stroke="#2a2a2a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M398 306 L428 338 L452 332" fill="none" stroke="#e4c6a8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- kroppen: smal och lite framåtlutad -->
    <path d="M370 398 C364 366 366 330 378 300 C384 288 400 284 410 292 C418 316 414 360 408 396 Z" class="hud"/>
    <g class="tunn" opacity=".8">
      <path d="M380 322q10 5 22 2M378 334q11 5 24 2M378 346q11 5 23 1M380 358q10 4 20 0"/>
    </g>

    <!-- närmre benet: låret ut ur byxorna, knät upp, foten på klippan -->
    <path d="M414 386 L460 334 L482 398" fill="none" stroke="#2a2a2a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M414 386 L460 334 L482 398" fill="none" stroke="#f1d8bf" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M478 398 q16 -2 24 4 q-14 6 -28 2 z" class="hud"/>
    <path d="M455 333q6-5 11 1" class="tunn"/>

    <!-- trasiga byxor, ovanpå lårens början -->
    <path d="M366 386 C374 374 404 372 420 378 L434 370 L438 384 L428 392 L432 400 L418 402 L412 410
             L400 404 L390 412 L382 404 L370 410 Z"
          fill="#c2ad8c" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M392 386l5 10M412 382l3 11" class="tunn"/>

    <!-- långt, tunt, stripigt blont hår som hänger ner över ryggen -->
    <g fill="none" stroke-linecap="round">
      <path d="M392 240 C380 256 376 284 370 318 M386 246 C376 268 372 298 366 334 M398 238 C388 262 386 296 378 340
               M404 236 C394 266 390 300 384 326 M382 252 C370 276 366 304 362 322 M394 244 C384 278 380 312 374 352"
            stroke="#2a2a2a" stroke-width="5"/>
      <path d="M392 240 C380 256 376 284 370 318 M386 246 C376 268 372 298 366 334 M398 238 C388 262 386 296 378 340
               M404 236 C394 266 390 300 384 326 M382 252 C370 276 366 304 362 322 M394 244 C384 278 380 312 374 352"
            stroke="#e3c46f" stroke-width="2.6"/>
    </g>

    <!-- huvud -->
    <ellipse cx="404" cy="262" rx="23" ry="27" class="hud"/>
    <!-- hjässan: tunt hår som ligger platt, några testar i pannan -->
    <path d="M381 262 C378 240 392 230 406 232 C420 233 428 242 427 252 C420 244 410 240 398 242 C390 246 386 254 381 262 Z"
          fill="#e8cd7e" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
    <g fill="none" stroke-linecap="round">
      <path d="M414 240 C420 246 422 252 421 258 M406 240 C410 248 410 254 408 258 M398 244 C394 252 392 258 393 266"
            stroke="#2a2a2a" stroke-width="4.4"/>
      <path d="M414 240 C420 246 422 252 421 258 M406 240 C410 248 410 254 408 258 M398 244 C394 252 392 258 393 266"
            stroke="#e3c46f" stroke-width="2"/>
    </g>
    <circle cx="417" cy="260" r="2.6" fill="#2a2a2a"/>
    <path d="M412 252q6-3 11 0" class="tunn"/>
    <path d="M425 262 q6 6 0 9" class="tunn"/>
    <path d="M390 262 q-7 2 -4 10 q3 4 6 0" class="tunn"/>

    <!-- långt skägg ner över bröstet -->
    <path d="M396 276 C400 282 416 284 428 274 C432 290 432 312 424 330 C420 342 414 350 406 356
             C408 342 400 336 400 324 C394 332 392 344 388 350 C388 330 384 300 396 276 Z"
          fill="#e6cc84" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
    <g class="tunn" opacity=".6">
      <path d="M408 290q4 18 0 36M416 288q6 16 2 32M400 296q-2 16 0 28"/>
    </g>
    <path d="M414 278 q6 3 10 -1" class="tunn"/>

    <!-- närmre armen, handen vilar på knät -->
    <path d="M392 302 L414 342 L458 336" fill="none" stroke="#2a2a2a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M392 302 L414 342 L458 336" fill="none" stroke="#f1d8bf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M454 330 q12 0 14 7 q-5 7 -14 5" class="hud"/>
  </g>

  <!-- vågor runt klippan -->
  <g class="tusch">
    <path d="M160 512 q20 -12 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
  </g>
  <g class="tunn">
    <path d="M40 470 q14 -8 28 0 t28 0 t28 0"/>
    <path d="M620 474 q14 -8 28 0 t28 0 t28 0 t28 0"/>
    <path d="M80 548 q18 -10 36 0 t36 0 t36 0 t36 0"/>
    <path d="M330 560 q18 -10 36 0 t36 0 t36 0 t36 0 t36 0"/>
    <path d="M600 540 q18 -10 36 0 t36 0 t36 0"/>
    <path d="M150 606 q16 -9 32 0 t32 0 t32 0"/>
    <path d="M460 612 q16 -9 32 0 t32 0 t32 0 t32 0"/>
    <path d="M690 600 q14 -8 28 0 t28 0"/>
  </g>
</svg>
