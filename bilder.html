<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Personlig Blogg</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="keywords"     content="Personlig Blogg Template">
  <meta name="description"  content="En ren och responsiv personlig blogg template.">

  <link rel="icon" href="img/favicon.ico">

  <link rel="stylesheet" href="fonts/fontawesome-free-6.7.2-web/css/all.min.css">
  <link rel="stylesheet" href="css/opensans.css">
  <link rel="stylesheet" href="css/bootstrap-4.5.2.min.css">

  <!-- All CSS flyttar vi till style.css – därav inget "unsafe-inline" -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Galleriet & lightboxen hamnar i style.css, men vi lägger till
       minimi-högst-upp för renderingsstabilitet (kom inte åt inline-stil). */
    #lightbox{z-index:1000;position:fixed;inset:0;display:none}
    .pil,.close-icon{cursor:pointer}
  </style>

  <!-- Strikt CSP – endast lokala resurser -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src   'none';
    script-src    'self'
      'sha384-D47DB5EE0C125722D221F68BC476C4EDD45BDEFE2660229BA50BF3C7471E81E8EED4C56C1AB5F9C57C40BECFC781E16C'
      'sha384-F9B291A03BA0509C0EA9EF159C97B3D531C08A115E5C714A92CB495B71C94F1C566B73A0E538C042C4687C824EB33DDB';
    style-src     'self';
    img-src       'self' data:;
    font-src      'self' data:;
    object-src    'none';
    base-uri      'self';
    form-action   'self';
    frame-ancestors 'none';
    block-all-mixed-content;
    upgrade-insecure-requests">
  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <meta http-equiv="X-Frame-Options"        content="DENY"/>
  <meta http-equiv="Referrer-Policy"          content="no-referrer"/>
</head>

<body>
  <div class="wrapper">
    <div id="sidebar-container"></div>

    <div class="content">
      <div id="header-container"></div>

      <div class="container py-5 px-2 bg-primary">
        <div class="row py-5 px-4">
          <div class="col-sm-6 text-center text-md-left">
            <h1 class="mb-3 mb-md-0 text-white text-uppercase font-weight-bold">Bildgalleri</h1>
          </div>
          <div class="col-sm-6 text-center text-md-right">
            <div class="d-inline-flex pt-2">
              <h4 class="m-0 text-white"><a class="text-white" href="index.html">Hem</a></h4>
              <h4 class="m-0 text-white px-2">/</h4>
              <h4 class="m-0 text-white">Bildgalleri</h4>
            </div>
          </div>
        </div>
      </div>

      <div class="container bg-white py-5 px-2">
        <div class="image-gallery" id="image-gallery">
          <div class="gallery-item">
            <a href="#" class="gallery-link" data-src="img/gallery/om-mig.jpg">
              <img src="img/gallery/om-mig.jpg" alt="Om mig">
            </a>
          </div>
          <div class="gallery-item">
            <a href="#" class="gallery-link" data-src="img/gallery/profile.jpg">
              <img src="img/gallery/profile.jpg" alt="Profile">
            </a>
          </div>
          <div class="gallery-item">
            <a href="#" class="gallery-link" data-src="img/gallery/strandad-man.jpg">
              <img src="img/gallery/strandad-man.jpg" alt="Strandad man">
            </a>
          </div>
          <div class="gallery-item">
            <a href="#" class="gallery-link" data-src="img/gallery/3-åring.jpg">
              <img src="img/gallery/3-åring.jpg" alt="3-åring">
            </a>
          </div>
        </div>
      </div>

      <div id="lightbox">
        <div class="lightbox-overlay"></div>
        <span class="close-icon"><i class="fas fa-times"></i></span>
        <a id="prevBtn" class="pil vanster" aria-label="Föregående bild">&#10094;</a>
        <div class="lightbox-content"><img id="lightbox-bild" src="" alt=""></div>
        <a id="nextBtn" class="pil hoger" aria-label="Nästa bild">&#10095;</a>
        <div id="bild-nummer" class="bild-nummer"></div>
      </div>

      <div id="footer-container"></div>
    </div>
  </div>

  <script src="jquery/jquery-3.7.1.min.js"
          integrity="sha384-D47DB5EE0C125722D221F68BC476C4EDD45BDEFE2660229BA50BF3C7471E81E8EED4C56C1AB5F9C57C40BECFC781E16C"
          crossorigin="anonymous"></script>
  <script src="js/bootstrap.bundle-4.5.2.min.js"></script>
  <script src="jquery/jquery.waypoints.min.js"
          integrity="sha384-F9B291A03BA0509C0EA9EF159C97B3D531C08A115E5C714A92CB495B71C94F1C566B73A0E538C042C4687C824EB33DDB"
          crossorigin="anonymous"></script>
  <script src="js/main.js"></script>
  <script src="js/site-data.js"></script>
  <script src="js/lightbox.js"></script>
</body>
</html>
